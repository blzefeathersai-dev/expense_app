name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install || true
          fi

      - name: Build iOS App (Simulator Debug Build)
        run: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $BUILD_TARGET \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find and Zip iOS Simulator App
        run: |
          APP_PATH=$(find ios/build -name "App.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ExpenseTracker-iOS-Simulator.zip" App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-iOS-Simulator
          path: ExpenseTracker-iOS-Simulator.zip
